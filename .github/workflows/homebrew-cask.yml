# Updates the window's Homebrew cask, Casks/senzor.rb in kankaj/homebrew-tap, for a release: its
# version and the SHA-256 of its two Mac apps, written by dev/homebrew-cask.sh. dist runs this as a
# publish job next to its own Homebrew job, which updates the formula of senzor-cli in the same
# tap (dist-workspace.toml); a pre-release leaves the tap alone. Pushing needs HOMEBREW_TAP_TOKEN,
# a token that may write to kankaj/homebrew-tap.
name: Homebrew cask

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  cask:
    name: Update the cask
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Senzor-*-apple-darwin.zip.sha256' --dir sums
          arm=$(cut -d' ' -f1 sums/Senzor-aarch64-apple-darwin.zip.sha256)
          intel=$(cut -d' ' -f1 sums/Senzor-x86_64-apple-darwin.zip.sha256)
          dev/homebrew-cask.sh "${TAG#v}" "$arm" "$intel" > senzor.rb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kankaj/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push the cask
        env:
          TAG: ${{ github.ref_name }}
        working-directory: tap
        run: |
          mkdir -p Casks
          cp ../senzor.rb Casks/senzor.rb
          git add Casks/senzor.rb
          if git diff --cached --quiet; then
            echo "the cask is up to date"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "senzor ${TAG#v}"
          # dist's formula job pushes to the same tap meanwhile: take its commit and try again.
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
