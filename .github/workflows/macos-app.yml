# Builds Senzor.app for both Macs from the window's macOS archives, after dist has built them; the
# zips join the release like dist's own files (an artifact named artifacts-*). dist runs this as a
# global artifacts job (see dist-workspace.toml), so on pull requests the apps can be downloaded
# from the run as well.
name: macOS app

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  app:
    name: Senzor.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the macOS archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Build, sign ad hoc and zip Senzor.app
        run: |
          for archive in target/distrib/senzor-*-apple-darwin.tar.xz; do
            dev/macos-app.sh "$archive" target/macos-app
          done
      - name: Attest
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/macos-app/Senzor-*.zip
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-macos-app
          path: target/macos-app/
