# Pushes the senzor-cli container image to ghcr.io/kankaj/senzor-cli, for linux/amd64 and
# linux/arm64, tagged X.Y.Z, X.Y, X and latest. dev/docker-image.sh builds it from the release's
# two Linux archives (checked against their .sha256 files) with crates/senzor-cli/Dockerfile, so
# the image carries the very binaries of the release. dist runs this as a publish job once the
# GitHub Release exists (dist-workspace.toml); a pre-release gets no image. It needs no secret:
# the workflow's own token may write the repository's packages.
#
# Run it by hand (Actions, GHCR, Run workflow, with a release tag such as v1.0.0) to push the
# image of a release made before this job existed, or again after the job failed. It takes the
# release's archives and this branch's Dockerfile. It moves X.Y, X and latest to that release
# too, so run it only for the newest one.
#
# The first push created the package as private: it was made public once, by hand, in the
# package's settings on GitHub (Danger Zone, Change visibility).
name: GHCR

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, such as v1.0.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kankaj/senzor-cli
  # The tag that started the release, or the one given to a manual run.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  image:
    name: Push the senzor-cli image
    # A manual run has no plan: its tag is checked by dev/docker-image.sh (X.Y.Z only).
    if: ${{ !fromJson(inputs.plan || '{}').announcement_is_prerelease }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the Linux archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'senzor-cli-*-unknown-linux-gnu.tar.xz*' --dir archives
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push
        run: dev/docker-image.sh archives "${TAG#v}" "$IMAGE"
      - name: Run the pushed image
        run: |
          out=$(docker run --rm "$IMAGE:${TAG#v}" --version)
          echo "$out"
          [[ $out == "senzor-cli ${TAG#v}" ]]
