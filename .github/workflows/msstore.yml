# Submits a release's MSIX bundle (the artifact msix-bundle, from msix.yml) to the Microsoft
# Store with Microsoft's Store CLI: it uploads the bundle in place of the last one, keeps the
# listing, commits the submission and leaves; certification follows by itself (usually 1-3 days).
# dist runs this as a publish job once the GitHub Release exists (dist-workspace.toml); a
# pre-release leaves the Store alone.
#
# The Store CLI only updates an app that is live, so the first submission was made by hand in
# Partner Center; the job waits for the repository variable MSSTORE_PUBLISH = true, set once
# Senzor is in the Store. It signs in as the Entra application "Senzor release" (Manager in
# Partner Center) with the secrets MSSTORE_TENANT_ID, MSSTORE_CLIENT_ID, MSSTORE_CLIENT_SECRET
# and MSSTORE_SELLER_ID. Senzor is free: the account prices per market, which the API cannot read
# back, so the job states the price itself (--priceId Free) rather than have the CLI stop.
name: Microsoft Store

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

env:
  # Store ID of Senzor (Partner Center: Product identity).
  PRODUCT_ID: 9PC0635WJF44
  # Microsoft's Store CLI and the SHA-256 of its Windows x64 zip, from the release's .sha256.txt.
  MSSTORE_CLI_VERSION: v0.4.3
  MSSTORE_CLI_SHA256: c5fb008b616f96b1b55f1d52e4e0a5dd8f6c156129b5f52f9b97ec0eed11bd57

jobs:
  store:
    name: Submit to the Microsoft Store
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease && vars.MSSTORE_PUBLISH == 'true' }}
    runs-on: windows-2025
    steps:
      - name: Fetch the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msix-bundle
          path: bundle/
      - name: Install the Store CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP\msstore.zip"
          Invoke-WebRequest "https://github.com/microsoft/msstore-cli/releases/download/$env:MSSTORE_CLI_VERSION/MSStoreCLI-win-x64.zip" -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $env:MSSTORE_CLI_SHA256) { throw "msstore CLI checksum mismatch: $sha" }
          Expand-Archive $zip "$env:RUNNER_TEMP\msstore"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\msstore"
      - name: Sign in to Partner Center
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        # The CLI reports usage to Microsoft unless told not to.
        run: |
          msstore settings --enableTelemetry false
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Submit
        shell: pwsh
        run: |
          $bundle = (Get-ChildItem bundle\*.msixbundle | Select-Object -First 1).FullName
          msstore publish $bundle --appId $env:PRODUCT_ID --priceId Free
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
