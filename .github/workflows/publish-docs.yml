# Publishes the docs of a release: moves the `release` branch to the released commit, which makes
# Cloudflare's Workers Builds build and deploy senzor.kankaj.cz (its production branch is
# `release`; every other branch, `main` among them, gets a preview). dist runs this once the
# GitHub Release exists, next to the package channels (publish-jobs in dist-workspace.toml), so a
# failing channel does not hold the docs back; a pre-release leaves the production docs alone. Only a fast-forward: `release` never moves backwards or sideways.
name: Publish the docs

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  release-branch:
    name: Move the release branch
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fast-forward release to the tag
        run: git push origin "HEAD:refs/heads/release"
