# Two floors with 100 sensors each, reproducible with a seed.
[broker]
host = "localhost"
port = 1883
client_id_prefix = "fleet-"

[simulation]
seed = 7

[[templates]]
id = "room-sensor"
interval = "30s"
availability = { topic = "building/{{ floor }}/{{ device_id }}/status", online = "online", offline = "offline" }

[[templates.messages]]
topic = "building/{{ floor }}/{{ device_id }}/telemetry"
payload = '{"co2": {{ co2 | round | int }}, "humidity": {{ humidity | round(1) }}, "seq": {{ seq }}}'

[templates.fields.co2]
generator = "random_walk"
start = 600
min = 400
max = 2500
step = 20

[templates.fields.humidity]
generator = "random_walk"
start = 45
min = 25
max = 70
step = 0.5

[[devices]]
id = "floor1"
template = "room-sensor"
count = 100
instance_id = "f1-room-{{ index }}"
params = { floor = "1" }
autostart = true

[[devices]]
id = "floor2"
template = "room-sensor"
count = 100
instance_id = "f2-room-{{ index }}"
params = { floor = "2" }
autostart = true
