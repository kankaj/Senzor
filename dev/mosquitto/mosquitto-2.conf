# Mosquitto 2 for local development and the ignored integration tests.
# Anonymous, no persistence: MQTT 5 and 3.1.1 clients on one listener.
listener 1883
# MQTT over WebSocket, for the tests of `transport = "websocket"`.
listener 8080
protocol websockets
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
