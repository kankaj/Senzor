# Release builds with dist (https://github.com/axodotdev/cargo-dist). Pushing a tag vX.Y.Z runs
# .github/workflows/release.yml, which `dist generate` writes from this file: never edit the
# workflow by hand, change this file and run `mise exec -- dist generate`. The steps of a release
# are in CLAUDE.md ("Releases") and dev/release.sh.

[workspace]
members = ["cargo:."]

[dist]
# Keep equal to `cargo-dist` in mise.toml.
cargo-dist-version = "0.33.1"
ci = "github"
# Linux, macOS and Windows, each on x86_64 and ARM.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
# No install scripts: people install through the package channels.
installers = []
# Apache-2.0 asks every copy to carry the NOTICE file; README, LICENSE and CHANGELOG come by
# themselves (auto-includes).
include = ["NOTICE"]
# Pull requests build and upload every archive without publishing anything, so a release can be
# tried before its tag exists.
pr-run-mode = "upload"
# A signed record (Sigstore) of which workflow built each file; check with `gh attestation verify`.
github-attestations = true
# Before anything is built: the tag, Cargo.toml, CHANGELOG.md and the Czech highlights agree.
plan-jobs = ["./release-check"]
# crates/senzor/wix/main.wxs, the MSI's template, has hand edits (a Start menu entry, LICENSE and
# NOTICE), so dist must not regenerate it. After changing [package.metadata.wix] in
# crates/senzor/Cargo.toml, carry the change into main.wxs by hand.
allow-dirty = ["msi"]
# Steps before each platform build: WiX for the Windows ARM MSI (see .github/build-setup.yml).
github-build-setup = "../build-setup.yml"
# After the platform builds: Senzor.app for both Macs, from the window's macOS archives; this
# version's docs for their folder on the docs site; and the Microsoft Store's MSIX bundle from the
# Windows archives (msix.yml; an artifact of the run, not a file of the release).
global-artifacts-jobs = ["./macos-app", "./docs-archive", "./msix"]
# After the GitHub Release exists, side by side so one failing does not hold back another: the
# production docs follow the release (the `release` branch); the Homebrew tap gets the formula
# dist writes for senzor-cli (installers = ["homebrew"] in crates/senzor-cli) and our cask for the
# window (Senzor.app), in one commit by one job (homebrew-tap.yml, with the HOMEBREW_TAP_TOKEN
# secret): dist's own Homebrew job, pushing to the same tap at the same time, lost the race at
# 1.0.0, so it is off, and so is `tap`, which only that job reads; winget gets a pull request per
# package in microsoft/winget-pkgs (winget.yml, with the WINGET_TOKEN secret); and the Microsoft
# Store gets the MSIX bundle (msstore.yml, once the MSSTORE_PUBLISH variable is true).
publish-jobs = ["./publish-docs", "./homebrew-tap", "./winget", "./msstore"]
# What the custom jobs may do beyond reading: the app job attests its zips as dist does its files;
# the docs job pushes the `release` branch.
github-custom-job-permissions = { "macos-app" = { contents = "read", id-token = "write", attestations = "write" }, "docs-archive" = { contents = "read", id-token = "write", attestations = "write" }, "publish-docs" = { contents = "write" }, "homebrew-tap" = { contents = "read" }, "winget" = { contents = "read" }, "msix" = { contents = "read" }, "msstore" = { contents = "read" } }

[dist.github-custom-runners]
# Linux on the older Ubuntu, so the binaries need only glibc 2.35; ARM natively on GitHub's ARM
# runners rather than cross-compiled.
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
aarch64-pc-windows-msvc = "windows-11-arm"
# GitHub retired macOS 14, dist's default for Apple Silicon, on 2026-11-02.
aarch64-apple-darwin = "macos-15"

# The actions dist's workflow uses, pinned to commits like the rest of our workflows
# (checkout v6.1.0, upload-artifact v7.0.2, download-artifact v8.0.2, rust-cache v2.9.3,
# attest v4.2.2).
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
"swatinem/rust-cache" = "d1527c8f67ef9af357290475d4af4b0fab8f12e0"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
