# Tool versions for developing Senzor, the same in CI (.github/workflows/ci.yml).
# Run `mise trust` once in this folder, then `mise install`.

[settings]
# The Rust version lives in rust-toolchain.toml, which rustup and IDEs read as well.
idiomatic_version_file_enable_tools = ["rust"]

[tools]
# For the documentation site in website/. Cloudflare's builds read the same versions from
# .node-version and `packageManager` in website/package.json; change them together (pnpm test checks),
# and the PNPM_VERSION build variable in the Cloudflare dashboard (website/README.md).
node = "26.12.0"
pnpm = "12.15.0"
# Release builds: dist makes .github/workflows/release.yml and runs in it (see dist-workspace.toml).
# Keep this version equal to `cargo-dist-version` there.
cargo-dist = "0.33.1"
