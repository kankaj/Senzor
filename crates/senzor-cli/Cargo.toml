[package]
name = "senzor-cli"
description = "MQTT sensor simulator: run Senzor projects headless, in a terminal, Docker or CI"
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
keywords.workspace = true
rust-version.workspace = true
categories = ["simulation", "command-line-utilities", "development-tools::testing"]

[dependencies]
clap.workspace = true
humantime.workspace = true
senzor-core = { workspace = true, features = ["schema"] }
senzor-mcp.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
rumqttc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
senzor-testkit.workspace = true

# Release builds (see dist-workspace.toml): a Homebrew formula, `brew install kankaj/tap/senzor-cli`,
# for macOS and Linux. (The window gets a cask instead, from .github/workflows/homebrew-cask.yml.)
[package.metadata.dist]
installers = ["homebrew"]
