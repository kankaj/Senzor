[package]
name = "senzor"
description = "MQTT sensor simulator: a window to edit, run and watch simulated sensors"
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
keywords.workspace = true
rust-version.workspace = true
categories = ["simulation", "gui", "development-tools::testing"]

[features]
# The `testing` module: helpers that drive the whole window headlessly, for `tests/gui.rs`.
test-support = ["dep:egui_kittest"]
# Renders the documentation's screenshots: cargo run -p senzor --example screenshots --features screenshots
screenshots = ["test-support", "egui_kittest/wgpu", "dep:image"]

[dependencies]
clap.workspace = true
eframe.workspace = true
egui-phosphor.workspace = true
fluent-templates.workspace = true
egui_kittest = { workspace = true, optional = true }
http-body-util.workspace = true
humantime.workspace = true
hyper.workspace = true
hyper-util.workspace = true
# Must match egui_kittest's image version: `render()` returns its RgbaImage, which needs `png` to save.
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
notify-rust.workspace = true
rfd.workspace = true
rustls-native-certs.workspace = true
senzor-core.workspace = true
senzor-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
# Asks Windows whether this copy runs from the Microsoft Store's MSIX package (src/package.rs).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx"] }

[build-dependencies]
# Embeds the icon into senzor.exe; build.rs only uses it when building for Windows.
winresource.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
rmcp = { workspace = true, features = ["client"] }
# The codes senzor-testkit's refusing broker answers with.
rumqttc.workspace = true
# Turns on `test-support` for this package's own tests, so `cargo test` needs no flags.
senzor = { path = ".", features = ["test-support"] }
senzor-testkit.workspace = true

[[example]]
name = "screenshots"
required-features = ["screenshots"]

# Release builds (see dist-workspace.toml). The window's archives also carry assets/linux/: the
# desktop entry and the icons a Linux package installs; on Windows it gets an MSI as well.
[package.metadata.dist]
include = ["../../NOTICE", "../../assets/linux/"]
installers = ["msi"]

# The MSI (WiX v3, through dist; its template crates/senzor/wix/main.wxs is edited by hand, see
# dist-workspace.toml). The GUIDs tell Windows that every version is the same app in the same
# place, so an MSI upgrades the one installed: never change them.
[package.metadata.wix]
upgrade-guid = "0046E879-2FB5-4DCB-98A7-564C93156A90"
path-guid = "8163A184-0AD7-4C23-8619-268DF0BA1DE0"
product-icon = "../../assets/icon/senzor.ico"
license = false
eula = false
