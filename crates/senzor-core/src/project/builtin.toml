[[templates]]
id = "co2"
interval = "10s"
availability = { topic = "senzor/{{ device_id }}/status", online = "online", offline = "offline" }
messages = [
    { topic = "senzor/{{ device_id }}/co2", payload = '{"co2": {{ co2 | round | int }}, "ts": {{ now_ms }}}' },
]
fields.co2 = { generator = "random_walk", start = 600, min = 400, max = 2000, step = 15 }

[[templates]]
id = "temperature"
interval = "10s"
availability = { topic = "senzor/{{ device_id }}/status", online = "online", offline = "offline" }
messages = [
    { topic = "senzor/{{ device_id }}/temperature", payload = '{"temperature": {{ temperature | round(1) }}, "ts": {{ now_ms }}}' },
]
fields.temperature = { generator = "sine", center = 21.5, amplitude = 1.5, period = "24h", noise = 0.1 }

[[templates]]
id = "humidity"
interval = "10s"
availability = { topic = "senzor/{{ device_id }}/status", online = "online", offline = "offline" }
messages = [
    { topic = "senzor/{{ device_id }}/humidity", payload = '{"humidity": {{ humidity | round(1) }}, "ts": {{ now_ms }}}' },
]
fields.humidity = { generator = "random_walk", start = 45, min = 30, max = 70, step = 0.5 }
