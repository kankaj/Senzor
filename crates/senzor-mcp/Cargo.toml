[package]
name = "senzor-mcp"
description = "The MCP server of Senzor, an MQTT sensor simulator: lets AI agents edit and run a project. Shared by the senzor window and senzor-cli; no stable API of its own."
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
keywords.workspace = true
rust-version.workspace = true
categories = ["simulation", "development-tools"]

[dependencies]
axum.workspace = true
base64.workspace = true
rand.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
humantime.workspace = true
tracing.workspace = true
schemars.workspace = true
senzor-core = { workspace = true, features = ["schema"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
jsonschema.workspace = true
rmcp = { workspace = true, features = ["client"] }
senzor-testkit.workspace = true
tokio = { workspace = true, features = ["test-util"] }
