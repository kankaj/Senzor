[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kankaj/Senzor"
homepage = "https://senzor.kankaj.cz"
authors = ["Jaroslav Kaňka"]
keywords = ["mqtt", "simulator", "iot", "sensor", "testing"]
# What `cargo install` from crates.io asks for: the Rust that rust-toolchain.toml pins, the only
# one Senzor is built and tested with. Change both together.
rust-version = "1.99"

[workspace.dependencies]
# On crates.io the crates depend on each other at exactly the workspace's version;
# dev/release.sh moves these pins with the version.
senzor-core = { path = "crates/senzor-core", version = "=1.0.0" }
senzor-mcp = { path = "crates/senzor-mcp", version = "=1.0.0" }
senzor-testkit = { path = "crates/senzor-testkit" }
assert_cmd = "2.2.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# Binary payloads: base64 (also used by rmcp) and CBOR.
base64 = "0.23.1"
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36.2", features = ["persistence"] }
# Icons for the GUI: one icon font (Phosphor, MIT) instead of egui's mixed emoji fonts.
egui-phosphor = "0.14.0"
egui_kittest = { version = "0.36.2", features = ["eframe"] }
# Translations (English and Czech): Fluent files embedded at compile time.
fluent-templates = { version = "0.15.1", default-features = false, features = ["macros", "walkdir"] }
# Desktop notifications: freedesktop over D-Bus (zbus, which accesskit already brings in),
# Windows toasts and the macOS notification centre.
notify-rust = "4.18.2"
rfd = "0.17.2"
humantime = "2.4.0"
humantime-serde = "1.1.1"
# The GUI's update check makes one HTTPS request: with hyper's HTTP/1 client (hyper already serves
# MCP) over rustls (already used for MQTT over TLS), so it brings in no new crates.
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
jsonschema = { version = "0.58.6", default-features = false }
# 3.0.4 changed the signature of `minijinja::filters::join` (render.rs wraps it), so the code
# needs 3.0.4 or later; 1.0.0 was built against 3.0.0 and only installs with `--locked`.
minijinja = { version = "3.0.5", features = ["json"] }
# The position of a .proto file's compile error (protox reports it as a miette diagnostic).
miette = { version = "7.6.0", default-features = false }
# Protobuf payloads: protox compiles .proto files in pure Rust (no protoc) into a descriptor pool,
# prost-reflect encodes a message from its JSON mapping (`serde`) with it and re-exports prost.
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.10.0"
rand = { version = "0.10.3", features = ["chacha"] }
# Field scripts and subscription scripts. `sync`: scripts run on tokio worker threads.
rhai = { version = "1.27.0", features = ["sync"] }
rmcp = { version = "3.8.0", default-features = false }
rumqttc = { version = "0.25.1", features = ["websocket"] }
rumqttd = { version = "0.20.0", default-features = false }
rustls-native-certs = "0.8.4"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
tokio-rustls = "0.26.6"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows-sys = "0.61.2"
winresource = "0.1.34"

# The builds that ship: the release workflow builds with `--profile dist`. Link-time optimisation
# across all crates and no debug symbols make the binaries smaller and a little faster than
# `--release`, at the cost of a slower build, so day-to-day release builds stay as they are.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
